<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeakLens — Product Introduction Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #080b11;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
    }
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 0 0 20px rgba(37,99,235,0.5);
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #3b82f6;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #1e293b;
      color: #ffffff;
    }
    .video-wrapper {
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <header>
      <div class="brand">
        <div class="logo-badge">LL</div>
        <div>
          <h2 style="font-size: 1.1rem; font-weight: 700;">LeakLens</h2>
          <p style="font-size: 0.75rem; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">Product Introduction Video</p>
        </div>
      </div>

      <div style="display: flex; gap: 0.75rem;">
        <a href="leaklens_intro.mp4" download class="btn btn-secondary">Download MP4</a>
        <a href="/dashboard" class="btn btn-primary">Skip to Live Demo ➔</a>
      </div>
    </header>

    <div class="video-wrapper">
      <video id="intro-video" src="leaklens_intro.mp4" controls autoplay playsinline></video>
    </div>

    <div style="font-size: 0.8rem; color: #64748b; font-family: 'JetBrains Mono', monospace;">
      Exact Single-Source Audio • 1080p HD Master Mastered Video
    </div>
  </div>

</body>
</html>
