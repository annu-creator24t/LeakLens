services:
  - type: web
    name: leaklens-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: leaklens
      - key: JWT_SECRET
        generateValue: true

